<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progreso N4</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#F8C8CE;--pink2:#FBDDE1;--rose:#E98C99;--cream:#FFF8F4;--brown:#8B5049;--brown2:#B07A72}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);font-family:'Zen Maru Gothic',sans-serif;color:var(--brown);display:flex;align-items:center;justify-content:center;padding:10px}
.card{width:100%;max-width:560px;background:var(--pink2);border-radius:22px;padding:24px 20px 16px;position:relative;overflow:hidden;box-shadow:0 3px 0 #f2b3bc}
.lace{position:absolute;top:0;left:0;right:0;height:9px;background:radial-gradient(circle at 6px 0,#fff 6px,transparent 6.5px) 0 0/12px 9px repeat-x}
.star{position:absolute;color:#fff;opacity:.85;font-size:13px}
h1{font-size:14px;font-weight:700;color:var(--brown2);margin-bottom:10px}
.item{margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;margin-bottom:5px}
.top small{font-weight:500;color:var(--brown2);font-size:12px;margin-left:4px}
.ctl{display:flex;align-items:center;gap:4px;font-size:13px}
.ctl button{border:0;background:#fff;color:var(--brown);width:24px;height:24px;border-radius:50%;font-weight:900;cursor:pointer;font-family:inherit}
.ctl button:hover{background:var(--pink)}
.ctl input{width:48px;border:0;border-radius:8px;background:#fff;color:var(--brown);font:inherit;font-weight:700;text-align:center;padding:2px}
.bar{height:12px;background:#fff;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(45deg,var(--rose) 0 8px,#ef9fab 8px 16px);transition:width .3s}
.pct{font-size:11px;color:var(--brown2);text-align:right;margin-top:2px}
.note{font-size:11px;color:var(--brown2);margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <div class="lace"></div>
  <span class="star" style="top:16px;right:22px">★</span>
  <span class="star" style="bottom:10px;left:20px;font-size:10px">★</span>
  <h1>N4の進み具合 · mi progreso</h1>
  <div id="list"></div>
  <div class="note">Cambia los números con − / + o escribiéndolos. Las metas son aproximadas.</div>
</div>
<script>
// Metas por defecto (aprox., el JLPT no publica una lista oficial).
// También se pueden poner en el link: ?kanji=120&vocab=600&gramatica=40
var P=new URLSearchParams(location.search);
var items=[
 {id:'kanji',jp:'漢字',es:'kanji',meta:+P.get('metaKanji')||300},
 {id:'vocab',jp:'単語',es:'vocabulario',meta:+P.get('metaVocab')||1500},
 {id:'gramatica',jp:'文法',es:'gramática',meta:+P.get('metaGramatica')||130}
];
function load(id,def){try{var v=localStorage.getItem('pyon-n4-'+id);if(v!==null)return +v}catch(e){}return def}
function save(id,v){try{localStorage.setItem('pyon-n4-'+id,v)}catch(e){}}
var list=document.getElementById('list');
items.forEach(function(it){
  it.val=load(it.id,+P.get(it.id)||0);
  var el=document.createElement('div');el.className='item';
  el.innerHTML='<div class="top"><span>'+it.jp+'<small>'+it.es+'</small></span>'+
   '<span class="ctl"><button data-d="-1">−</button><input type="number" min="0" value="'+it.val+'"> / '+it.meta+' <button data-d="1">+</button></span></div>'+
   '<div class="bar"><i></i></div><div class="pct"></div>';
  list.appendChild(el);
  var inp=el.querySelector('input'),bar=el.querySelector('i'),pct=el.querySelector('.pct');
  function upd(){
    it.val=Math.max(0,Math.round(+inp.value||0));inp.value=it.val;save(it.id,it.val);
    var p=Math.min(100,it.val/it.meta*100);bar.style.width=p+'%';
    pct.textContent=Math.round(p)+'%'+(p>=100?' · よくできました！':'');
  }
  el.querySelectorAll('button').forEach(function(b){b.onclick=function(){inp.value=(+inp.value||0)+(+b.dataset.d);upd()}});
  inp.onchange=upd;upd();
});
</script>
</body>
</html>
