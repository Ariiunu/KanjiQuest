<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuenta JLPT</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#F8C8CE;--pink2:#FBDDE1;--rose:#E98C99;--cream:#FFF8F4;--brown:#8B5049;--brown2:#B07A72}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{background:transparent;font-family:'Zen Maru Gothic',sans-serif;color:var(--brown);display:flex;align-items:center;justify-content:center;padding:10px}
.card{transform-origin:center;width:100%;max-width:560px;background:var(--pink2);border-radius:22px;padding:24px 22px 18px;position:relative;overflow:hidden;box-shadow:0 3px 0 #f2b3bc;display:flex;align-items:center;gap:18px}
.lace{position:absolute;top:0;left:0;right:0;height:9px;background:radial-gradient(circle at 6px 0,#fff 6px,transparent 6.5px) 0 0/12px 9px repeat-x}
.star{position:absolute;color:#fff;opacity:.85;font-size:14px}
.bunny{width:120px;height:auto;flex:none;margin:-6px -4px -10px -8px}
.info{flex:1;min-width:0}
.small{font-size:13px;color:var(--brown2);font-weight:700;letter-spacing:.04em}
.big{display:flex;align-items:baseline;gap:6px;margin:2px 0 4px}
.big .n{font-size:58px;font-weight:900;line-height:1}
.big .u{font-size:22px;font-weight:900}
.es{font-size:14px;font-weight:700}
.bar{height:10px;background:#fff;border-radius:99px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:99px}
.phrase{font-size:13px;font-weight:700}
.phrase span{color:var(--brown2);font-weight:500}
@media(max-width:380px){.bunny{width:84px}.big .n{font-size:44px}}
</style>
</head>
