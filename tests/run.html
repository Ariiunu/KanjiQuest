<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas · Kanji no Tankyuu</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;color:#3d2433;background:#fff6f8}
h1{font-size:1.2rem}
.lv{background:#fff;border:1px solid #fbd3df;border-radius:14px;padding:12px 16px;margin:10px 0}
.ok{color:#1f7a4d}.bad{color:#b4243a}
pre{white-space:pre-wrap;font-size:.8rem;margin:6px 0 0}
iframe{width:390px;height:700px;border:1px solid #fbd3df;border-radius:12px;position:fixed;right:-2000px}
</style>
</head>
<body>
<h1>Pruebas de la app</h1>
<p>Abre la app en cada nivel, completa las lecciones y «Estudiar hoy», y juega todos los modos de repaso en las tres dificultades respondiendo bien. Tu progreso se respalda antes y se restaura al terminar.</p>
<div id="out"></div>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const out = document.getElementById('out');

// runs inside the app (iframe), so it can use the app's own globals
function appTest() {
  const errs = [], seen = {};
  S.snd = false;
  const play = (p, m) => {
    while (p.i < p.items.length) {
      const it = p.items[p.i];
      if (it.kind === 'intro') { introOk(); continue; }
      if (it.kind === 'rule') { pNext(); continue; }
      let ok;
      if (m === 'type') { render(); document.getElementById('ti').value = it.v.r; tChk(); ok = p.a === true; }
      else if (m === 'draw') { dRate(2); continue; }
      else if (m === 'build') { [...it.v.w].forEach(c => bTap(it.t.findIndex((t, i) => t === c && !p.sel.includes(i)))); ok = p.a === true; }
      else { if (it.o.length < 2 || it.c < 0 || new Set(it.o).size !== it.o.length) errs.push('opciones raras en ' + m + ' ' + it.k.k); chAns(it.c); ok = p.a === it.c; }
      if (!ok) errs.push('respuesta correcta marcada mal: ' + m + ' ' + it.k.k);
      pNext();
    }
  };
  let lessonsDone = 0;
  if (KN) { while (nextLesson() && lessonsDone < 100) { startLesson(nextLesson().id); play(V.ps, 'lesson'); lessonsDone++; } }
  try { startToday(); play(V.ps, 'today'); } catch (e) { errs.push('Estudiar hoy: ' + e.message); }
  let rounds = 0;
  const modes = ['mix', 'listen', 'type', 'fill', 'parts', 'build', 'match', 'draw', 'speed'];
  for (const d of [0, 1, 2]) {
    S.dif = d;
    const scopes = KN ? lessons().map(L => () => { V.lsel = [L.id]; }) : G.map((g, i) => () => { V.g = i; });
    for (const set of scopes) {
      V.tab = 'fc'; set();
      for (const m of modes) {
        try {
          pStart(m);
          if (V.rm === 'hub') { seen[m] = seen[m] || 0; continue; }
          seen[m] = (seen[m] || 0) + 1; rounds++;
          const p = V.ps;
          if (m === 'speed') { for (let i = 0; i < 5; i++) spA(p.cur.t); clearInterval(V.tm); continue; }
          if (m === 'match') { p.ks.forEach(k => { mClick(k.k, 'L'); mClick(k.k, 'R'); }); if (!p.fin) errs.push('emparejar no terminó'); continue; }
          play(p, m);
          render();
          if (!document.body.innerHTML.includes('Otra ronda')) errs.push('sin pantalla final en ' + m);
        } catch (e) { errs.push(m + ': ' + e.message); }
      }
    }
  }
  try { go('fc'); for (let i = 0; i < 5 && V.fc.q.length; i++) { V.fc.flip = true; render(); rate('good'); } } catch (e) { errs.push('flashcards: ' + e.message); }
  if (!KN) { try { V.qz = null; go('qz'); qzStart(); } catch (e) { errs.push('quiz: ' + e.message); } }
  for (const t of ['home', 'ov', 'grp', 'map', 'lib', 'ach', 'lvl']) { try { go(t); } catch (e) { errs.push('pantalla ' + t + ': ' + e.message); } }
  return { lv: LV, items: K.length, lessonsDone, rounds, modes: seen, errs };
}

async function runLevel(lv) {
  ['kkana', 'kn5', 'kn4'].forEach(k => localStorage.removeItem(k));
  localStorage.setItem('klv', lv);
  sessionStorage.setItem('kgo', '1');
  const f = document.createElement('iframe');
  f.src = '../index.html?t=' + Date.now();
  document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  await wait(400);
  const w = f.contentWindow, jsErrs = [];
  w.addEventListener('error', e => jsErrs.push('error de JavaScript: ' + e.message));
  let r;
  try { r = w.eval('(' + appTest.toString() + ')()'); } catch (e) { r = { lv, errs: ['la prueba falló: ' + e.message] }; }
  r.errs = r.errs.concat(jsErrs);
  f.remove();
  return r;
}

(async () => {
  const backup = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); backup[k] = localStorage.getItem(k); }
  const results = [];
  try {
    for (const lv of ['kana', 'n5', 'n4']) {
      const r = await runLevel(lv);
      results.push(r);
      const ok = !r.errs.length;
      out.insertAdjacentHTML('beforeend', `<div class="lv"><b class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${lv}</b> · ${r.items} elementos · ${r.lessonsDone || 0} lecciones · ${r.rounds} rondas<pre>${Object.entries(r.modes || {}).map(([m, n]) => m + ': ' + n).join('  ')}${r.errs.length ? '\n\n' + [...new Set(r.errs)].slice(0, 30).join('\n') : ''}</pre></div>`);
    }
  } finally {
    localStorage.clear();
    Object.entries(backup).forEach(([k, v]) => localStorage.setItem(k, v));
    sessionStorage.removeItem('kgo');
  }
  const pass = results.every(r => !r.errs.length);
  document.title = (pass ? '✓ ' : '✗ ') + document.title;
  out.insertAdjacentHTML('beforeend', `<p class="${pass ? 'ok' : 'bad'}"><b>${pass ? 'Todo bien' : 'Hay errores'}</b> · progreso restaurado</p>`);
  window.RESULT = results;
})();
</script>
</body>
</html>
