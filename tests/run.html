<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas · Kanji no Tankyuu</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;color:#3d2433;background:#fff6f8}
h1{font-size:1.2rem}
.lv{background:#fff;border:1px solid #fbd3df;border-radius:14px;padding:12px 16px;margin:10px 0}
.ok{color:#1f7a4d}.bad{color:#b4243a}
pre{white-space:pre-wrap;font-size:.8rem;margin:6px 0 0}
iframe{width:390px;height:700px;border:1px solid #fbd3df;border-radius:12px;position:fixed;right:-2000px}
</style>
</head>
<body>
<h1>Pruebas de la app</h1>
<p>Abre la app en cada nivel, completa las lecciones y «Estudiar hoy», y juega todos los modos de repaso en las tres dificultades respondiendo bien. Tu progreso se respalda antes y se restaura al terminar.</p>
<div id="out"></div>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const out = document.getElementById('out');

// runs inside the app (iframe), so it can use the app's own globals
function appTest() {
  const errs = [], seen = {};
  S.snd = false;
  const play = (p, m) => {
    while (p.i < p.items.length) {
      const it = p.items[p.i];
      if (it.kind === 'intro') { introOk(); continue; }
      if (it.kind === 'rule') { pNext(); continue; }
      let ok;
      if (m === 'type') { render(); document.getElementById('ti').value = it.v.r; tChk(); ok = p.a === true; }
      else if (m === 'draw') { dRate(2); continue; }
      else if (it.kind === 'order') { render(); [0, 1, 2, 3].forEach(oTap); ok = p.a === true; }
      else if (m === 'build') { [...it.v.w].forEach(c => bTap(it.t.findIndex((t, i) => t === c && !p.sel.includes(i)))); ok = p.a === true; }
      else { if (it.o.length < 2 || it.c < 0 || new Set(it.o).size !== it.o.length) errs.push('opciones raras en ' + m + ' ' + (it.k ? it.k.k : it.tag)); chAns(it.c); ok = p.a === it.c; }
      if (!ok) errs.push('respuesta correcta marcada mal: ' + m + ' ' + (it.k ? it.k.k : it.tag));
      pNext();
    }
  };
  let lessonsDone = 0;
  if (KN) { while (nextLesson() && lessonsDone < 100) { startLesson(nextLesson().id); play(V.ps, 'lesson'); lessonsDone++; } }
  try { startToday(); play(V.ps, 'today'); } catch (e) { errs.push('Estudiar hoy: ' + e.message); }
  let rounds = 0;
  const modes = ['mix', 'listen', 'type', 'fill', 'parts', 'build', 'match', 'draw', 'speed'];
  for (const d of [0, 1, 2]) {
    S.dif = d;
    const scopes = KN ? lessons().map(L => () => { V.lsel = [L.id]; }) : G.map((g, i) => () => { V.g = i; });
    for (const set of scopes) {
      V.tab = 'fc'; set();
      for (const m of modes) {
        try {
          pStart(m);
          if (V.rm === 'hub') { seen[m] = seen[m] || 0; continue; }
          seen[m] = (seen[m] || 0) + 1; rounds++;
          const p = V.ps;
          if (m === 'speed') { for (let i = 0; i < 5; i++) spA(p.cur.t); clearInterval(V.tm); continue; }
          if (m === 'match') { p.ks.forEach(k => { mClick(k.k, 'L'); mClick(k.k, 'R'); }); if (!p.fin) errs.push('emparejar no terminó'); continue; }
          play(p, m);
          render();
          if (!document.body.innerHTML.includes('Otra ronda')) errs.push('sin pantalla final en ' + m);
        } catch (e) { errs.push(m + ': ' + e.message); }
      }
    }
  }
  // kana: practise chosen rows of the table (katakana "ka" row + hiragana "kya" row), questions only from those rows
  if (KN) { try { V.tab = 'fc'; rpick(TROWS[1][0][1][1].join(',')); rpick(TROWS[0][2][1][0].join(',')); const ks = pp().map(x => x.k); if (ks.length !== 8) errs.push('filas: ' + ks.length + ' kana');
    pStart('mix'); if (V.ps.items.some(it => !ks.includes(it.k.k))) errs.push('filas: pregunta fuera de las filas'); play(V.ps, 'mix'); rpick(); seen.filas = 1; } catch (e) { errs.push('filas: ' + e.message); } }
  // drawing check: every character with stroke data passes when drawn right (scaled and moved) and fails with a stroke reversed or missing
  try { let n = 0; for (const k of K) { const ref = refStrokes(k.k); if (!ref) { errs.push('sin trazos: ' + k.k); continue; } n++;
      const u = ref.map(s => s.map(([x, y]) => [x * 2.3 + 25, y * 2.3 + 20])); if (dGrade(u, ref).rate !== 2) errs.push('dibujo correcto rechazado: ' + k.k);
      if (ref.length >= 3) { const m = u.slice(); m.splice(1, 1); if (dGrade(m, ref).cnt !== -1) errs.push('trazo faltante sin aviso: ' + k.k); } }
    seen.dibujo = n; } catch (e) { errs.push('dibujo: ' + e.message); }
  // JLPT-style practice (kanji levels): sentences, ordering, reading, listening and the mock exam
  if (!KN) for (const m of ['jvocab', 'jorder', 'jread', 'jlisten', 'jexam']) for (let r = 0; r < 5; r++) {
    try {
      pStart(m); const p = V.ps; seen[m] = (seen[m] || 0) + 1; rounds++;
      if (!p.items.length) errs.push('sin preguntas en ' + m);
      play(p, m); render(); clearInterval(V.et);
      if (!document.body.innerHTML.includes(m === 'jexam' ? 'Otro simulacro' : 'Otra ronda')) errs.push('sin pantalla final en ' + m);
      if (m === 'jexam' && !document.body.innerHTML.includes('Aprobarías')) errs.push('simulacro perfecto sin aprobar');
    } catch (e) { errs.push(m + ': ' + e.message); }
  }
  try { go('fc'); for (let i = 0; i < 5 && V.fc.q.length; i++) { V.fc.flip = true; render(); rate('good'); } } catch (e) { errs.push('flashcards: ' + e.message); }
  if (!KN) { try { V.qz = null; go('qz'); qzStart(); } catch (e) { errs.push('quiz: ' + e.message); } }
  // games: rain until game over, memory until solved, then back to the menu
  try {
    go('games'); gStart('rain'); if (!V.ps.ready) errs.push('lluvia sin pantalla de inicio'); rainGo(); let p = V.ps, n = 0;
    while (!p.fin && n++ < 60) { if (n < 10) rainHit(p.cur.c); else rainHit((p.cur.c + 1) % p.cur.o.length); clearTimeout(V.rt); if (!p.fin) rainNext(); }
    if (!p.fin || p.sc <= 0) errs.push('lluvia no terminó bien');
    gStart('mem'); p = V.ps;
    for (let i = 0; i < p.cards.length / 2; i++) { const js = p.cards.map((c, j) => c.i === i ? j : -1).filter(j => j >= 0); memFlip(js[0]); memFlip(js[1]); }
    if (!p.fin) errs.push('memoria no terminó');
    // Atrapa: tap only the target until time runs out; しりとり: chain correct words; ¿Cuál no va?: pick the odd one
    gStart('whack'); whackGo(); p = V.ps; for (let i = 0; i < 40; i++) { whackTick(); const j = p.cells.findIndex(c => c && c.k === p.tg); if (j >= 0) whackHit(j); }
    p.t0 -= 1e6; whackTick(); if (!p.fin || p.sc <= 0) errs.push('atrapa no terminó bien');
    gStart('shiri'); shiriGo(); p = V.ps;
    for (let i = 0; i < 30 && !p.fin; i++) { const need = shLast(p.cur), g = p.o[p.c]; if (shFirst(g) !== need || p.o.filter(w => shFirst(w) === need).length !== 1) errs.push('しりとり con opciones malas'); shiriPick(p.c); clearTimeout(V.rt); p.cur = g; p.used.add(g.w); shiriRound(); }
    for (let i = 0; i < 3 && !p.fin; i++) { shiriPick((p.c + 1) % 4); clearTimeout(V.rt); if (p.lives > 0) shiriRound(); else { p.fin = true; gRec('shiri', p.best); } }
    render(); if (!p.fin || !document.body.innerHTML.includes('Cadena de')) errs.push('しりとり no terminó');
    gStart('odd'); oddGo(); p = V.ps;
    for (let i = 0; i < 40; i++) { if (p.o.length !== 4 || p.o.some(x => !x) || new Set(p.o).size !== 4) errs.push('cuál no va con cartas malas'); oddPick(p.c); clearTimeout(V.rt); oddRound(); }
    p.t0 -= 1e6; clearInterval(V.tm); p.fin = true; gRec('odd', p.sc); render(); if (!document.body.innerHTML.includes('40 aciertos')) errs.push('cuál no va sin puntaje');
    clearInterval(V.tm);
    // Sopa de letras: every hidden word reads right in the grid and the game ends when all are found (3 difficulties)
    for (const d of [0, 1, 2]) { S.dif = d; gStart('sopa'); sopaGo(); p = V.ps;
      if (p.words.length < 4) errs.push('sopa con pocas palabras: ' + p.words.length);
      if (p.words.some(w => w.cells.map(([r, c]) => p.g[r][c]).join('') !== w.w)) errs.push('sopa: palabra mal escrita en la cuadrícula');
      p.words.forEach(w => { sopaTap(...w.cells[0]); sopaTap(...w.cells[w.cells.length - 1]); });
      if (!p.fin) errs.push('sopa no terminó'); }
    S.dif = 1;
    // games with your own selection: only the chosen rows (kana) or groups (kanji)
    S.gsel = KN ? [TROWS[0][0][1][1].join(','), TROWS[1][0][1][2].join(',')] : ['0', '1']; const sel = gCustom().map(x => x.k);
    if (sel.length < 6 || gPool().some(x => !sel.includes(x.k))) errs.push('juegos: la selección no se respeta');
    gStart('rain'); rainGo(); if (!sel.includes(V.ps.cur.k.k)) errs.push('lluvia fuera de la selección'); clearTimeout(V.rt); S.gsel = [];
    gMenu(); if (!document.querySelector('.gcard')) errs.push('sin menú de juegos');
  } catch (e) { errs.push('juegos: ' + e.message); }
  for (const t of ['home', 'ov', 'grp', 'map', 'lib', 'ach', 'lvl']) { try { go(t); } catch (e) { errs.push('pantalla ' + t + ': ' + e.message); } }
  return { lv: LV, items: K.length, lessonsDone, rounds, modes: seen, errs };
}

async function runLevel(lv) {
  ['kkana', 'kn5', 'kn4'].forEach(k => localStorage.removeItem(k));
  localStorage.setItem('klv', lv);
  sessionStorage.setItem('kgo', '1');
  const f = document.createElement('iframe');
  f.src = '../index.html?t=' + Date.now();
  document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  await wait(400);
  const w = f.contentWindow, jsErrs = [];
  w.addEventListener('error', e => jsErrs.push('error de JavaScript: ' + e.message));
  let r;
  try { r = w.eval('(' + appTest.toString() + ')()'); } catch (e) { r = { lv, errs: ['la prueba falló: ' + e.message] }; }
  r.errs = r.errs.concat(jsErrs);
  f.remove();
  return r;
}

(async () => {
  const backup = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); backup[k] = localStorage.getItem(k); }
  const results = [];
  try {
    for (const lv of ['kana', 'n5', 'n4']) {
      const r = await runLevel(lv);
      results.push(r);
      const ok = !r.errs.length;
      out.insertAdjacentHTML('beforeend', `<div class="lv"><b class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${lv}</b> · ${r.items} elementos · ${r.lessonsDone || 0} lecciones · ${r.rounds} rondas<pre>${Object.entries(r.modes || {}).map(([m, n]) => m + ': ' + n).join('  ')}${r.errs.length ? '\n\n' + [...new Set(r.errs)].slice(0, 30).join('\n') : ''}</pre></div>`);
    }
  } finally {
    localStorage.clear();
    Object.entries(backup).forEach(([k, v]) => localStorage.setItem(k, v));
    sessionStorage.removeItem('kgo');
  }
  const pass = results.every(r => !r.errs.length);
  document.title = (pass ? '✓ ' : '✗ ') + document.title;
  out.insertAdjacentHTML('beforeend', `<p class="${pass ? 'ok' : 'bad'}"><b>${pass ? 'Todo bien' : 'Hay errores'}</b> · progreso restaurado</p>`);
  window.RESULT = results;
})();
</script>
</body>
</html>
