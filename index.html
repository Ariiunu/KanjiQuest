.jes{display:block;font-size:.8rem;font-weight:400;margin:2px 0 10px}
.jw{display:block;text-align:center;font-size:2rem;font-family:'Shippori Mincho',serif;border:1.5px solid var(--card2);border-radius:16px;padding:12px;margin:8px 0;background:#fff7fa}
.tc{position:relative;overflow:hidden;background:linear-gradient(180deg,#fffafc 0%,#ffeef5 100%);border:1px solid #ffd6e5;border-radius:30px;padding:18px 16px 16px;box-shadow:0 20px 40px -24px rgba(240,80,138,.55)}
.tch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative}
.tch h2{margin:2px 0 0;font-size:1.4rem;font-weight:900}
.tch h2 span{color:var(--ind);font-size:2rem}
.tch h2 small{font-size:.85rem;color:var(--mut);font-weight:700}
.tcc{display:flex;gap:6px}
.tcc span{background:#fff;border:1px solid #ffd6e5;border-radius:99px;padding:4px 10px;font-size:.78rem;font-weight:700}
.tree{display:block;width:100%;max-width:440px;margin:0 auto;position:relative}
.tcf{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid #ffd6e5}
.fl{transform-box:fill-box;transform-origin:center;animation:bloom .6s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--d)*30ms)}
@keyframes bloom{from{transform:scale(0);opacity:0}}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-12px;width:9px;height:6px;border-radius:70% 30% 70% 30%;background:#ff9ab9;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(40px,440px) rotate(300deg);opacity:0}}
.dc.sm{padding:14px}.dc.sm .tile{width:92px;padding:8px}.dc.sm h2{font-size:1.2rem}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.sc{background:#fff;border:1px solid var(--card2);border-radius:22px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.stamp{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;border:3px solid #e0436f;color:#e0436f;display:grid;place-items:center;font-family:'Shippori Mincho',serif;font-weight:800;font-size:2.3rem;transform:rotate(-6deg);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 6px #e0436f55;background:radial-gradient(circle at 30% 30%,#fff5f8,#fff)}
.stamp.lock{border-color:#d9c3cf;color:#d9c3cf;border-style:dashed;box-shadow:none;background:#faf6f8}
.stamp.new{animation:thump .7s cubic-bezier(.2,.8,.2,1.2) both}
@keyframes thump{0%{transform:scale(2) rotate(-18deg);opacity:0}55%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.sc b{display:block;font-size:.85rem}
.sc small{display:block;color:var(--mut);font-size:.72rem;margin-top:3px}
.sbar{height:6px;border-radius:99px;background:#ffe4ee;overflow:hidden;margin-top:8px}.sbar i{display:block;height:100%;background:var(--sak)}
@media(prefers-reduced-motion:reduce){.petals{display:none}}
</style>

<body>
<div id="app"></div>
<p class="credit">Orden de trazos: KanjiVG © Ulrich Apel, licencia CC BY-SA 3.0 · kanjivg.tagaini.net</p>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)this.classList.remove('show')"><div class="box" id="mbox"></div></div>
<script>
const D=[
['心',4,'シン','こころ','corazón','heart','安心 あんしん tranquilidad|心配 しんぱい preocupación','Un corazón con latidos a los lados'],
['引',4,'イン','ひ-く','tirar, jalar','pull','引く ひく tirar|引っ越し ひっこし mudanza','Un arco 弓 con una cuerda: tiras de ella'],
['少',4,'ショウ','すく-ない / すこ-し','poco','few, little','少し すこし un-poco|少年 しょうねん niño','Un 小 (pequeño) al que le quitaron algo'],
['切',4,'セツ','き-る','cortar','cut','切る きる cortar|大切 たいせつ importante','七 + 刀: siete cortes con un cuchillo'],
['文',4,'ブン','ふみ','texto, escritura','sentence, writing','作文 さくぶん redacción|文化 ぶんか cultura','Una persona con los brazos cruzados escribiendo'],
['以',5,'イ','—','mediante, desde','by means of','以上 いじょう más-de|以外 いがい excepto','Una persona 人 usando una herramienta'],
['世',5,'セ・セイ','よ','mundo, era','world, generation','世界 せかい mundo|世話 せわ cuidado','Tres décadas 十 juntas = una generación'],
['写',5,'シャ','うつ-す','copiar, fotografiar','copy, photograph','写真 しゃしん foto|写す うつす copiar','Una cubierta con un objeto debajo: lo copias'],
['有',6,'ユウ','あ-る','tener, existir','have, exist','有名 ゆうめい famoso|有る ある existir','Una mano sosteniendo carne 月: lo tengo'],
['考',6,'コウ','かんが-える','pensar','think','考える かんがえる pensar|参考 さんこう referencia','Un anciano 耂 con bastón, pensando'],
['地',6,'チ・ジ','—','tierra, suelo','ground, earth','地図 ちず mapa|地下鉄 ちかてつ metro','Tierra 土 + serpiente 也 en el suelo'],
['同',6,'ドウ','おな-じ','igual','same','同じ おなじ igual|同時 どうじ al-mismo-tiempo','Una boca 口 dentro de un marco: todos iguales'],
['住',7,'ジュウ','す-む','vivir, residir','live, reside','住む すむ vivir|住所 じゅうしょ dirección','Persona 亻 + dueño 主: vive en su casa'],
['医',7,'イ','—','medicina','medicine','医者 いしゃ médico|医学 いがく medicina','Una caja con una flecha 矢: el botiquín'],
['低',7,'テイ','ひく-い','bajo','low','低い ひくい bajo|最低 さいてい lo-peor','Persona 亻 agachada sobre la base 氐'],
['取',8,'シュ','と-る','tomar, coger','take','取る とる tomar|受け取る うけとる recibir','Una mano 又 tomando una oreja 耳'],
['屋',9,'オク','や','tienda, techo','shop, roof','本屋 ほんや librería|部屋 へや habitación','Un cuerpo 尸 con un 至 que llega: el techo'],
['持',9,'ジ','も-つ','tener, sostener','hold','持つ もつ sostener|気持ち きもち sentimiento','Mano 扌 + templo 寺: la mano que sostiene'],
['風',9,'フウ','かぜ','viento','wind','風邪 かぜ resfriado|台風 たいふう tifón','Una vela 几 inflada con un insecto 虫 dentro'],
['発',9,'ハツ','—','partir, emitir','depart, emit','出発 しゅっぱつ salida|発音 はつおん pronunciación','Pies 癶 arrancando: salir disparado'],
['急',9,'キュウ','いそ-ぐ','apurarse','hurry','急ぐ いそぐ apurarse|特急 とっきゅう expreso','Atrapar 刍 con el corazón 心 acelerado'],
['紙',10,'シ','かみ','papel','paper','紙 かみ papel|手紙 てがみ carta','Hilo 糸 + familia 氏: fibras que forman papel'],
['病',10,'ビョウ','や-む','enfermedad','illness','病気 びょうき enfermedad|病院 びょういん hospital','Cama con fiebre 疒 + 丙: estar enfermo'],
['野',11,'ヤ','の','campo, llanura','field, plain','野菜 やさい verdura|野球 やきゅう béisbol','Aldea 里 + yo 予: el campo abierto'],
['運',12,'ウン','はこ-ぶ','transportar, suerte','carry, luck','運動 うんどう ejercicio|運転 うんてん conducir','Camino ⻌ + ejército 軍: mover tropas'],
['場',12,'ジョウ','ば','lugar','place','場所 ばしょ lugar|工場 こうじょう fábrica','Tierra 土 + sol naciente 昜: un lugar abierto'],
['答',12,'トウ','こた-える','responder','answer','答える こたえる responder|返答 へんとう respuesta','Bambú 竹 + unir 合: encajar la respuesta'],
['試',13,'シ','こころ-みる / ため-す','probar, examen','try, test','試験 しけん examen|試合 しあい partido','Palabras 言 + modelo 式: poner a prueba'],
['意',13,'イ','—','intención, significado','meaning, intention','意味 いみ significado|注意 ちゅうい atención','Sonido 音 + corazón 心: lo que suena en tu interior'],
['歌',14,'カ','うた / うた-う','canción, cantar','song, sing','歌う うたう cantar|歌手 かしゅ cantante','Dos bocas 可可 + bostezo 欠: abrir la boca y cantar'],
['親',16,'シン','おや / した-しい','padres, íntimo','parent, intimate','親 おや padres|両親 りょうしん ambos-padres','Árbol 木 de pie 立 que te mira 見: tus padres'],
['館',16,'カン','—','edificio, sala','hall, building','図書館 としょかん biblioteca|映画館 えいがかん cine','Comida 食 + oficina 官: una sala de servicio']
];
const blk=s=>s<=5?0:s<=8?1:s<=11?2:3;
const K=D.map(a=>({k:a[0],s:a[1],on:a[2],kun:a[3],es:a[4],en:a[5],v:a[6].split('|').map(x=>{const p=x.split(' ');return{w:p[0],r:p[1],m:p.slice(2).join(' ').replace(/-/g,' ')}}),mn:a[7],b:blk(a[1])}));
const BN=[['Bloque 1','Sencillos · 2-5 trazos'],['Bloque 2','Intermedios · 6-8 trazos'],['Bloque 3','Avanzados · 9-11 trazos'],['Bloque 4','Complejos · 12+ trazos']];
const TH=[0,60,150,280],DAYS=[0,1,3,7,14,30];
let S={xp:0,streak:0,last:'',cards:{},qd:{}};
try{S={...S,...JSON.parse(localStorage.getItem('kn4')||'{}')}}catch(e){}S.st=S.st||{};
const save=()=>{try{localStorage.setItem('kn4',JSON.stringify(S))}catch(e){}};
const iso=d=>new Date(d).toISOString().slice(0,10);
const lvl=()=>Math.floor(S.xp/100)+1;
const mast=k=>stOf(k)===2;
const inB=b=>K.filter(x=>x.b===b);
const unl=b=>b===0||S.xp>=TH[b]||!!S.qd[b-1];
let V={tab:'map',b:0,fc:null,qz:null,fb:'all',fs:'all'};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function addXP(n){const o=lvl();const t=iso(Date.now());if(S.last!==t){S.streak=S.last===iso(Date.now()-864e5)?S.streak+1:1;S.last=t}S.xp+=n;save();if(lvl()>o)toast('🎉 ¡Subiste al nivel '+lvl()+'!')}
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const rd=k=>k.kun!=='—'?k.kun.split(' / ')[0]:k.on.split('・')[0];
function medals(){const m=K.filter(x=>mast(x.k)).length;return[['🌸','Primer paso',S.xp>=10],['🔥','Racha de 3',S.streak>=3],['⭐','10 dominados',m>=10],['🏆','Bloque completo',[0,1,2,3].some(b=>inB(b).every(x=>mast(x.k)))],['👑','500 XP',S.xp>=500]]}
function head(){const p=S.xp%100;return`<div class="top"><h1>🌸 Kanji Quest N4</h1><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">🔥 Racha: ${S.streak}</span><span class="pill" style="color:var(--gold)">✨ ${S.xp} XP</span><span class="pill">Nv. ${lvl()}</span></div></div><div class="bar"><i style="width:${p}%"></i></div><p class="mut" style="margin:4px 0 10px">${100-p} XP para el nivel ${lvl()+1}</p><div class="medals">${medals().map(m=>`<span class="medal ${m[2]?'':'off'}">${m[0]} ${m[1]}</span>`).join('')}</div><div class="nav">${[['map','🗺️ Mundos'],['fc','🃏 Flashcards'],['qz','⚔️ Quiz'],['lib','📖 Biblioteca']].map(t=>`<button class="${V.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>`}
function go(t,b){V.tab=t;if(b!==undefined)V.b=b;if(t==='fc')startFC();if(t==='qz')V.qz=null;render()}
function render(){let h=head();if(V.tab==='map')h+=mapV();else if(V.tab==='fc')h+=fcV();else if(V.tab==='qz')h+=qzV();else h+=libV();document.getElementById('app').innerHTML=h}
function selB(){return`<p>Mundo: <select onchange="V.b=+this.value;go(V.tab)">${[0,1,2,3].map(b=>`<option value="${b}" ${V.b===b?'selected':''} ${unl(b)?'':'disabled'}>${BN[b][0]}${unl(b)?'':' 🔒'}</option>`).join('')}</select></p>`}
function mapV(){return`<div class="grid">${[0,1,2,3].map(b=>{const l=inB(b),m=l.filter(x=>mast(x.k)).length,u=unl(b);return`<div class="box ${u?'':'lock'}"><h3 style="margin:0">${u?'':'🔒 '}${BN[b][0]}${S.qd[b]?' ✅':''}</h3><p class="mut">${BN[b][1]}</p><div class="bar"><i style="width:${m/l.length*100}%"></i></div><p class="mut">${m}/${l.length} Kanjis Dominados</p>${u?`<button class="btn pri" onclick="go('fc',${b})">Flashcards</button> <button class="btn" onclick="go('qz',${b})">Quiz</button>`:`<p class="mut">Se desbloquea con ${TH[b]} XP o aprobando el quiz del bloque anterior (4/5).</p>`}</div>`}).join('')}</div>`}
function startFC(){const l=inB(V.b),now=Date.now();let q=l.filter(x=>!S.cards[x.k]||(S.cards[x.k].due||0)<=now);if(!q.length)q=l.slice();V.fc={q:sh(q).map(x=>x.k),flip:false}}
function fcCards(){let h=selB();const f=V.fc;if(!f||!f.q.length)return h+`<div class="box" style="text-align:center"><h2>🎊 ¡Sesión completa!</h2><p class="mut">Vuelve mañana para mantener tu racha.</p><button class="btn pri" onclick="go('fc')">Repasar otra vez</button></div>`;const k=K.find(x=>x.k===f.q[0]);return h+`<p class="mut" style="text-align:center">Quedan ${f.q.length} tarjetas · toca para voltear</p><div class="scene" onclick="V.fc.flip=!V.fc.flip;document.getElementById('in').classList.toggle('flip')"><div class="inner ${f.flip?'flip':''}" id="in"><div class="face"><div class="big">${k.k}</div><span class="mut">${k.s} trazos</span></div><div class="face back"><div style="font-size:2.4rem;font-weight:900">${k.k}</div><div><b>${k.es}</b> · <span class="mut">${k.en}</span></div><div style="color:var(--sak)">音 ${k.on}</div><div style="color:var(--ind)">訓 ${k.kun}</div><div class="mut">${k.v.map(v=>v.w+' ('+v.r+') '+v.m).join('<br>')}</div><div style="color:var(--gold);margin-top:4px">💡 ${k.mn}</div></div></div></div><div class="rate"><button class="btn" style="border-color:var(--bad)" onclick="rate('hard')">Difícil</button><button class="btn" style="border-color:var(--ind)" onclick="rate('good')">Bien</button><button class="btn" style="border-color:var(--ok)" onclick="rate('easy')">Fácil</button></div>`}
function rate(r){const k=V.fc.q.shift();const c=S.cards[k]||{box:0};c.box=r==='easy'?Math.min(5,c.box+2):r==='good'?Math.min(5,c.box+1):0;c.due=Date.now()+(r==='hard'?6e4:DAYS[c.box]*864e5);S.cards[k]=c;if(r==='hard')V.fc.q.push(k);V.fc.flip=false;addXP(r==='hard'?2:5);render()}
function mkQ(k){const t=Math.floor(Math.random()*3),o=K.filter(x=>x!==k);let c,w,q;if(t===0){q=`¿Qué significa ${k.k}?`;c=k.es;w=sh(o).map(x=>x.es)}else if(t===1){q=`¿Cuál es una lectura de ${k.k}?`;c=rd(k);w=sh(o).map(rd)}else{q=`¿Cuántos trazos tiene ${k.k}?`;c=k.s;w=sh([k.s-2,k.s-1,k.s+1,k.s+2,k.s+3].filter(n=>n>1))}w=[...new Set(w)].filter(x=>x!==c).slice(0,3);return{q,c,o:sh([c,...w])}}
function qzV(){let h=selB();if(!V.qz){return h+`<div class="box" style="text-align:center"><h2>⚔️ Desafío del ${BN[V.b][0]}</h2><p class="mut">5 preguntas estilo JLPT (lectura, escritura y significado) · +10 XP por acierto · 4/5 desbloquea el siguiente mundo</p><button class="btn pri" onclick="V.qz={items:sh(inB(V.b)).slice(0,5).map(mkQ),i:0,sc:0,a:null};render()">¡Empezar!</button></div>`}const z=V.qz;if(z.i>=5){return h+`<div class="box" style="text-align:center"><h2>${z.sc>=4?'🎉':'💪'} ${z.sc}/5</h2><p class="mut">${z.sc>=4?(V.b<3?'¡Mundo siguiente desbloqueado!':'¡Has completado el último mundo!'):'Necesitas 4/5 para desbloquear. ¡Inténtalo de nuevo!'}</p><button class="btn pri" onclick="V.qz=null;render()">Reintentar</button></div>`}const it=z.items[z.i];return h+`<div class="box"><p class="mut">Pregunta ${z.i+1}/5</p><h2 style="margin:0 0 8px">${it.q}</h2>${it.o.map((x,j)=>`<button class="opt ${z.a===null?'':x===it.c?'ok':z.a===j?'bad':''}" ${z.a===null?'':'disabled'} onclick="ans(${j})">${x}</button>`).join('')}${z.a!==null?`<button class="btn pri" onclick="V.qz.i++;V.qz.a=null;if(V.qz.i>=5&&V.qz.sc>=4){S.qd[V.b]=true;save();toast('🔓 ¡Bloque superado!')}render()">Siguiente →</button>`:''}</div>`}
function ans(j){const z=V.qz,it=z.items[z.i];z.a=j;if(it.o[j]===it.c){z.sc++;addXP(10)}render()}
function libV(){const l=K.filter(x=>(V.fb==='all'||x.b===+V.fb)&&(V.fs==='all'||(V.fs==='l')===!!mast(x.k)));return`<p><select onchange="V.fb=this.value;render()"><option value="all">Todos los trazos</option>${BN.map((b,i)=>`<option value="${i}" ${V.fb==i?'selected':''}>${b[1]}</option>`).join('')}</select> <select onchange="V.fs=this.value;render()"><option value="all">Todos</option><option value="l" ${V.fs==='l'?'selected':''}>Aprendidos</option><option value="p" ${V.fs==='p'?'selected':''}>Pendientes</option></select></p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${l.map(x=>`<div class="cell ${mast(x.k)?'done':''}" data-tip="${tip(x)}" onclick="det('${x.k}')"><b>${x.k}</b><span class="mut">${x.s} trazos</span><br><span style="font-size:.8rem">${x.es.split(',')[0]}</span></div>`).join('')}</div>`}
function det(k){const x=K.find(a=>a.k===k);document.getElementById('mbox').innerHTML=`${sv(x.k)}<p class="mut">${x.s} trazos · ${BN[x.b][0]}</p><p><b>${x.es}</b> · ${x.en}</p><p style="color:var(--sak)">音読み ${x.on}</p><p style="color:var(--ind)">訓読み ${x.kun}</p><p class="mut">${x.v.map(v=>v.w+' ('+v.r+') '+v.m).join('<br>')}</p><p style="color:var(--gold)">💡 ${x.mn}</p><button class="btn pri" onclick="document.getElementById('modal').classList.remove('show')">Cerrar</button>`;document.getElementById('modal').classList.add('show')}
S.gd=S.gd||{};
const G=[['🧠','Mente y sentimientos','心考意持','pensar, sentir y estado de ánimo (気持ち)'],['🏠','Casa y lugares','住屋場館地野','dónde vives y los lugares de la ciudad'],['🚆','Viajes y movimiento','運発急引取','salir (出発), tren expreso (特急), mudanza (引っ越し)'],['✏️','Estudio y arte','文紙写試答歌','escribir, papel, exámenes y canciones'],['🏥','Salud y clima','病医風','hospital, médico y resfriado (風邪)'],['👨‍👩‍👧','Gente y sociedad','親世有同以','padres, mundo y cómo nos relacionamos'],['⚖️','Cantidad y acciones','少切低','poco, bajo y cortar']];
K.forEach(x=>x.g=G.findIndex(g=>g[2].includes(x.k)));
V.g=null;V.tab=S.seen?'grp':'ov';
const _m=medals;medals=()=>[..._m(),['🔭','Vista general',!!S.seen],['🧩','Grupo superado',Object.keys(S.gd).length>0]];
const pool=()=>V.g!=null?K.filter(x=>x.g===V.g):inB(V.b);
const scope=()=>V.g!=null?G[V.g][0]+' '+G[V.g][1]:BN[V.b][0];
function head(){const p=S.xp%100;return`<div class="top"><h1>🌸 Kanji Quest N4</h1><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">🔥 Racha: ${S.streak}</span><span class="pill" style="color:var(--gold)">✨ ${S.xp} XP</span><span class="pill">Nv. ${lvl()}</span></div></div><div class="bar"><i style="width:${p}%"></i></div><p class="mut" style="margin:4px 0 10px">${100-p} XP para el nivel ${lvl()+1}</p><div class="medals">${medals().map(m=>`<span class="medal ${m[2]?'':'off'}">${m[0]} ${m[1]}</span>`).join('')}</div><div class="nav">${[['ov','🔭 1 Panorama'],['grp','🧩 2 Grupos'],['fc','🃏 Flashcards'],['qz','⚔️ Quiz'],['map','🗺️ Mundos'],['lib','📖 Biblioteca']].map(t=>`<button class="${V.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>`}
function go(t,b,g){V.tab=t;if(b!==undefined){V.b=b;V.g=null}if(g!==undefined)V.g=g;if(t==='fc')startFC();if(t==='qz')V.qz=null;render();window.scrollTo(0,0)}
function render(){let h=head();const t=V.tab;h+=t==='ov'?ovV():t==='grp'?grpV():t==='map'?mapV():t==='fc'?fcV():t==='qz'?qzV():libV();document.getElementById('app').innerHTML=h}
function selB(){return`<p>Estudiar: <select onchange="setScope(this.value)"><optgroup label="Por concepto">${G.map((g,i)=>`<option value="g${i}" ${V.g===i?'selected':''}>${g[0]} ${g[1]}</option>`).join('')}</optgroup><optgroup label="Por trazos">${[0,1,2,3].map(b=>`<option value="b${b}" ${V.g==null&&V.b===b?'selected':''} ${unl(b)?'':'disabled'}>${BN[b][0]}${unl(b)?'':' 🔒'}</option>`).join('')}</optgroup></select></p>`}
function setScope(v){if(v[0]==='g')V.g=+v.slice(1);else{V.g=null;V.b=+v.slice(1)}go(V.tab)}
function startFC(){const l=pool(),now=Date.now();let q=l.filter(x=>!S.cards[x.k]||(S.cards[x.k].due||0)<=now);if(!q.length)q=l.slice();V.fc={q:sh(q).map(x=>x.k),flip:false}}
function ovV(){return`<div class="box" style="margin-bottom:12px"><h3 style="margin:0 0 6px">🔭 Paso 1: mira el panorama completo</h3><p class="mut" style="margin:0">Recorre los ${K.length} kanjis agrupados por concepto, sin memorizar: solo para tener el mapa general. Después aprenderás grupo por grupo (Paso 2). Este método se llama <b>organizador previo</b> (Advance Organizer, de David Ausubel) con <b>diferenciación progresiva</b>: primero lo general, luego los detalles. Toca cualquier kanji para ver su ficha.</p></div>${G.map((g,i)=>`<div class="box" style="margin-bottom:10px"><b>${g[0]} ${g[1]}</b> <span class="mut">· ${g[3]}</span><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${K.filter(x=>x.g===i).map(x=>`<div class="cell" style="min-width:82px" onclick="det('${x.k}')"><b style="font-size:2rem">${x.k}</b><span style="font-size:.75rem">${x.es.split(',')[0]}</span></div>`).join('')}</div></div>`).join('')}<div style="text-align:center"><button class="btn pri" onclick="seen()">${S.seen?'Ir a estudiar por grupos →':'✅ Ya vi el panorama (+15 XP)'}</button></div>`}
function seen(){if(!S.seen){S.seen=true;addXP(15)}go('grp')}
function grpV(){return`<p class="mut">Paso 2: aprende un grupo por sesión. Flashcards primero, quiz al final.</p><div class="grid">${G.map((g,i)=>{const l=K.filter(x=>x.g===i),m=l.filter(x=>mast(x.k)).length;return`<div class="box"><h3 style="margin:0">${g[0]} ${g[1]}${S.gd[i]?' ✅':''}</h3><div style="font-size:1.8rem;margin:6px 0">${[...g[2]].join(' ')}</div><p class="mut">${g[3]}</p><div class="bar"><i style="width:${m/l.length*100}%"></i></div><p class="mut">${m}/${l.length} Kanjis Dominados</p><button class="btn pri" onclick="go('fc',undefined,${i})">Flashcards</button> <button class="btn" onclick="go('qz',undefined,${i})">Quiz</button></div>`}).join('')}</div>`}
function nxt(){const z=V.qz;z.i++;z.a=null;if(z.i>=z.items.length&&z.sc>=Math.ceil(z.items.length*.8)){if(V.g==null)S.qd[V.b]=true;else S.gd[V.g]=true;save();toast('🔓 ¡Superado!')}render()}
function qzV(){let h=selB();if(!V.qz){const n=Math.min(5,pool().length);return h+`<div class="box" style="text-align:center"><h2>⚔️ Desafío: ${scope()}</h2><p class="mut">${n} preguntas estilo JLPT (lectura, escritura y significado) · +10 XP por acierto · con 80% o más lo superas${V.g==null?' y desbloqueas el siguiente mundo':''}</p><button class="btn pri" onclick="V.qz={items:sh(pool()).slice(0,5).map(mkQ),i:0,sc:0,a:null};render()">¡Empezar!</button></div>`}const z=V.qz,n=z.items.length;if(z.i>=n){const ok=z.sc>=Math.ceil(n*.8);return h+`<div class="box" style="text-align:center"><h2>${ok?'🎉':'💪'} ${z.sc}/${n}</h2><p class="mut">${ok?'¡Superado!':'Necesitas el 80% para superarlo. ¡Inténtalo otra vez!'}</p><button class="btn pri" onclick="V.qz=null;render()">Reintentar</button> <button class="btn" onclick="go('grp')">Ver grupos</button></div>`}const it=z.items[z.i];return h+`<div class="box"><p class="mut">Pregunta ${z.i+1}/${n}</p><h2 style="margin:0 0 8px">${it.q}</h2>${it.o.map((x,j)=>`<button class="opt ${z.a===null?'':x===it.c?'ok':z.a===j?'bad':''}" ${z.a===null?'':'disabled'} onclick="ans(${j})">${x}</button>`).join('')}${z.a!==null?`<button class="btn pri" onclick="nxt()">Siguiente →</button>`:''}</div>`}

const stk=l=>{const c=[0,0,0],n=l.length||1;l.forEach(x=>c[stOf(x.k)]++);return`<div class="stk"><i class="a" style="width:${c[2]/n*100}%"></i><i class="v" style="width:${c[1]/n*100}%"></i></div><div class="lg"><span><s class="a"></s>${c[2]} aprendidos</span><span><s class="v"></s>${c[1]} vistos</span><span><s class="n"></s>${c[0]} nuevos</span></div>`};
function det(k){const x=K.find(a=>a.k===k);document.getElementById('mbox').innerHTML=`${sv(x.k)}<p class="mut">${x.s} trazos · ${G[x.g][0]} ${G[x.g][1]}</p><p><b>${x.es}</b> · ${x.en}</p><p style="color:var(--sak)">音読み ${x.on}</p><p style="color:var(--ind)">訓読み ${x.kun}</p><p class="mut">${x.v.map(v=>v.w+' ('+v.r+') '+v.m).join('<br>')}</p>${x.mn.startsWith('Escr')?'':`<p style="color:var(--gold)">💡 ${x.mn}</p>`}<div class="mut" style="margin-top:6px">¿Cómo lo tienes?</div>${stBtns(k,1)}<button class="btn pri" style="margin-top:10px" onclick="document.getElementById('modal').classList.remove('show')">Cerrar</button>`;document.getElementById('modal').classList.add('show')}
function homeV(){const g=recG(),gr=G[g],d=K[Math.floor(Date.now()/864e5)%K.length],v=d.v[0],dt=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}),pct=Math.round(K.filter(x=>mast(x.k)).length/K.length*100),fresh=!Object.keys(S.st).length&&!Object.keys(S.cards).length;return`<div class="dc"><div class="wm">${d.k}</div><div class="dtop"><span>✦ Kanji del día</span><span>${dt}</span></div><div class="drow"><div class="tile">${sv(d.k)}</div><div class="dinfo"><h2>${d.es}</h2><div class="den">${d.en} · ${d.s} trazos</div><div class="dch"><span>音 ${d.on}</span><span>訓 ${d.kun}</span></div></div></div><div class="dex"><b>${v.w}</b><span>${v.r}</span><em>${v.m}</em></div><div class="dact"><button class="btn pri" onclick="det('${d.k}')">Ver ficha</button><button class="btn" onclick="setSt('${d.k}',2)">${stOf(d.k)===2?'✓ Ya lo sabes':'Ya lo sé'}</button></div></div><div class="box prog"><div class="ph"><b>Tu progreso</b><span class="mut">${pct}% aprendido</span></div>${stk(K)}<div class="mini"><span>🔥 <b>${S.streak}</b> días</span><span>Nivel <b>${lvl()}</b></span><span><b>${S.xp}</b> XP</span></div></div><div class="box cont"><div><div class="mut">Sigue con</div><b>${gr[0]} ${gr[1]}</b></div><button class="btn pri" onclick="go('fc',undefined,${g})">Continuar →</button></div>${fresh?`<div class="box cont"><div><b>¿Ya conoces algunos kanjis?</b><div class="mut">Márcalos y no empiezas de cero.</div></div><button class="btn" onclick="libSel(null)">Marcar</button></div>`:''}`}
function planV(){const g=recG(),gr=G[g],l=K.filter(x=>x.g===g),gm=l.filter(x=>mast(x.k)).length,md=medals();return`<div class="sec" style="margin-top:0">Plan de hoy</div><div class="plan"><div class="pl ${S.seen?'dn':''}" onclick="go('ov')"><i>${S.seen?'✓':'1'}</i><div><b>Mira el panorama</b><span class="mut">${S.seen?'¡Hecho! Vuelve cuando quieras':K.length+' kanjis, un vistazo por tema'}</span></div></div><div class="pl" onclick="libSel(null)"><i>2</i><div><b>Marca los que ya conoces</b><span class="mut">Salta lo que ya dominas</span></div></div><div class="pl" onclick="go('fc',undefined,${g})"><i>3</i><div><b>Estudia ${gr[0]} ${gr[1]}</b><span class="mut">${gm}/${l.length} aprendidos</span></div></div><div class="pl" onclick="V.g=${g};go('fc')"><i>4</i><div><b>Practica lo que ya viste</b><span class="mut">Escribe, completa, empareja y dibuja</span></div></div></div><div class="sec">Logros</div><div class="medals">${md.map(x=>`<span class="medal ${x[2]?'':'off'}">${x[0]} ${x[1]}</span>`).join('')}</div>`}
function grpV(){return`<div class="grid">${G.map((g,i)=>{const l=K.filter(x=>x.g===i);return`<div class="box"><h3 style="margin:0 0 4px">${g[0]} ${g[1]}${S.gd[i]?' ✅':''}</h3><div class="kp">${[...g[2]].slice(0,7).join(' ')}${l.length>7?' …':''}</div><p class="mut" style="margin:6px 0 10px">${g[3]}</p>${stk(l)}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" onclick="go('fc',undefined,${i})">Estudiar</button><button class="btn" onclick="go('qz',undefined,${i})">Quiz</button><button class="btn" onclick="libSel(${i})">Ya conozco algunos</button></div></div>`}).join('')}</div>`}
V.fs='all';V.sel=false;V.ss=[];
const libList=()=>K.filter(x=>(V.fb==='all'||x.b===+V.fb)&&(V.fg==='all'||x.g===+V.fg)&&(V.fs==='all'||stOf(x.k)===+V.fs));
function libSel(g){V.fg=g==null?'all':''+g;V.fb='all';V.fs='all';V.sel=true;V.ss=[];go('lib')}
function lc(k){if(!V.sel)return det(k);const i=V.ss.indexOf(k);i<0?V.ss.push(k):V.ss.splice(i,1);render()}
function bulk(v){V.ss.forEach(k=>setSt(k,v,0,1));toast(V.ss.length+' kanjis actualizados');V.ss=[];render()}
function libV(){const l=libList(),act=V.fb!=='all'||V.fg!=='all'||V.fs!=='all';return`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><select onchange="V.fg=this.value;render()"><option value="all">Todos los grupos</option>${G.map((g,i)=>`<option value="${i}" ${V.fg==i?'selected':''}>${g[0]} ${g[1]}</option>`).join('')}</select><select onchange="V.fb=this.value;render()"><option value="all">Todos los trazos</option>${BN.map((b,i)=>`<option value="${i}" ${V.fb==i?'selected':''}>${b[1]}</option>`).join('')}</select><select onchange="V.fs=this.value;render()"><option value="all">Todos los estados</option><option value="0" ${V.fs==='0'?'selected':''}>No vistos</option><option value="1" ${V.fs==='1'?'selected':''}>Vistos</option><option value="2" ${V.fs==='2'?'selected':''}>Aprendidos</option></select>${act?`<button class="btn" onclick="V.fb=V.fg=V.fs='all';render()">Limpiar</button>`:''}<button class="btn ${V.sel?'pri':''}" onclick="V.sel=!V.sel;V.ss=[];render()">${V.sel?'Listo':'☑ Seleccionar'}</button></div>${V.sel?`<div class="selbar"><b>${V.ss.length}</b> seleccionados<button class="btn" onclick="V.ss=libList().map(x=>x.k);render()">Todos los visibles</button><span class="mut">Marcar como:</span><button class="btn pri" onclick="bulk(2)">Aprendido</button><button class="btn" onclick="bulk(1)">Visto</button><button class="btn" onclick="bulk(0)">No visto</button></div>`:''}<p class="mut" style="margin:0 0 10px">${l.length} kanjis · ○ nuevo · 👁 visto · ✓ aprendido</p>${l.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${l.map(x=>{const s=stOf(x.k);return`<div class="cell st${s} ${V.ss.includes(x.k)?'on':''}" data-tip="${tip(x)}" onclick="lc('${x.k}')"><b>${x.k}</b><span class="mut">${x.s} trazos</span><br><span style="font-size:.8rem">${x.es.split(',')[0]}</span><span class="bd">${['','👁','✓'][s]}</span></div>`}).join('')}</div>`:`<div class="box" style="text-align:center">No hay kanjis con estos filtros.</div>`}`}
function render(){const t=V.tab,T={home:'🌸 Kanji Quest',plan:'📋 Mi plan',ov:'🔭 Panorama',grp:'🧩 Aprender',map:'🧩 Aprender',fc:'🃏 Repaso',qz:'⚔️ Quiz',lib:'📖 Biblioteca'};let h=`<div class="top"><h1>${T[t]}</h1></div>`;h+=t==='home'?homeV():t==='plan'?planV():t==='ov'?ovV():(t==='grp'||t==='map')?learnV():t==='fc'?fcV():t==='qz'?qzV():libV();document.getElementById('app').innerHTML=h;const on=(t==='ov'||t==='map')?'grp':t;document.getElementById('bn').innerHTML=[['home','🏠','Inicio'],['plan','📋','Plan'],['grp','🧩','Aprender'],['fc','🃏','Repaso'],['qz','⚔️','Quiz'],['lib','📖','Biblioteca']].map(x=>`<button class="${on===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}

const MU={か:'が',が:'か',き:'ぎ',ぎ:'き',く:'ぐ',ぐ:'く',け:'げ',げ:'け',こ:'ご',ご:'こ',さ:'ざ',ざ:'さ',し:'じ',じ:'し',す:'ず',ず:'す',せ:'ぜ',ぜ:'せ',そ:'ぞ',ぞ:'そ',た:'だ',だ:'た',て:'で',で:'て',と:'ど',ど:'と',は:'ば',ば:'ぱ',ぱ:'は',ひ:'び',び:'ぴ',ぴ:'ひ',ふ:'ぶ',ぶ:'ぷ',ぷ:'ふ',へ:'べ',べ:'ぺ',ぺ:'へ',ほ:'ぼ',ぼ:'ぽ',ぽ:'ほ'};
const ALLR=[...new Set(K.flatMap(x=>x.v.map(v=>v.r)))],ALLM=[...new Set(K.flatMap(x=>x.v.map(v=>v.m)))];
function disR(r){const a=[...r],o=new Set();sh(a.map((c,i)=>MU[c]?i:-1).filter(i=>i>=0)).forEach(i=>{const b=a.slice();b[i]=MU[a[i]];o.add(b.join(''))});sh(ALLR.filter(x=>x!==r&&Math.abs([...x].length-a.length)<=1)).forEach(x=>o.add(x));o.delete(r);return[...o].slice(0,3)}
function disW(w,k){const o=new Set();for(const x of sh(K.filter(x=>x!==k&&x.g===k.g)).concat(sh(K.filter(x=>x!==k&&x.g!==k.g)))){o.add(w.replace(k.k,x.k));if(o.size>=3)break}o.delete(w);return[...o]}
const jq=(t,jp,es,body)=>`<span class="jt">${t}</span><span class="jp">${jp}</span><span class="mut jes">${es}</span><span class="jw">${body}</span>`;
function mkQ(k){const vs=k.v.filter(v=>v.w.includes(k.k)),v=(vs.length?vs:k.v)[Math.random()*(vs.length||k.v.length)|0],t=Math.random();let q,c,w;
if(t<.4){q=jq('読み方','＿＿のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。','Elige la lectura correcta de la palabra subrayada.',`<u>${v.w}</u>`);c=v.r;w=disR(v.r)}
else if(t<.8&&vs.length){q=jq('表記','＿＿のことばは漢字でどう書きますか。1・2・3・4から一つえらびなさい。','Elige cómo se escribe en kanji la palabra subrayada.',`<u>${v.r}</u>`);c=v.w;w=disW(v.w,k)}
else{q=jq('意味','＿＿のことばの意味として最もよいものをえらびなさい。','¿Qué significa la palabra subrayada?',`<u>${v.w}</u> <small style="font-size:.9rem">${v.r}</small>`);c=v.m;w=sh(ALLM.filter(x=>x!==v.m)).slice(0,3)}
const op=sh([c,...w.slice(0,3)]),o=op.map((x,j)=>`${j+1}. ${x}`);return{q,c:o[op.indexOf(c)],o}}

S.un=S.un||{};S.vw=S.vw||{};
const apr=()=>K.filter(x=>mast(x.k)).length;
const AC=[['見','Vista general','Recorre el panorama completo',()=>[S.seen?1:0,1]],['初','Primer paso','Estudia o marca tu primer kanji',()=>[K.filter(x=>stOf(x.k)>=1).length,1]],['花','10 flores','Aprende 10 kanjis',()=>[apr(),10]],['林','40 flores','Aprende 40 kanjis',()=>[apr(),40]],['森','100 flores','Aprende 100 kanjis',()=>[apr(),100]],['桜','Árbol en flor','Aprende todos los kanjis',()=>[apr(),K.length]],['火','Racha de 3','Estudia 3 días seguidos',()=>[Math.max(S.best||0,S.streak),3]],['炎','Racha de 7','Estudia 7 días seguidos',()=>[Math.max(S.best||0,S.streak),7]],['龍','Racha de 30','Estudia 30 días seguidos',()=>[Math.max(S.best||0,S.streak),30]],['星','500 XP','Suma 500 XP',()=>[S.xp,500]],['戦','Primer desafío','Supera un quiz',()=>[Object.keys(S.qd).length+Object.keys(S.gd).length,1]],['組','Grupo completo','Aprende todo un grupo',()=>[G.some((g,i)=>K.filter(x=>x.g===i).every(x=>mast(x.k)))?1:0,1]],['習','100 respuestas','Responde 100 ejercicios',()=>[S.act||0,100]],['筆','5 dibujos','Dibuja 5 kanjis de memoria',()=>[S.dr||0,5]],['速','3 emparejados','Completa 3 juegos de emparejar',()=>[S.mt||0,3]]];
function checkAch(){S.best=Math.max(S.best||0,S.streak);const nw=[];AC.forEach(a=>{const[c,t]=a[3]();if(c>=t&&!S.un[a[1]]){S.un[a[1]]=Date.now();nw.push(a[1])}});if(nw.length){save();toast(nw.length===1?'🏅 Nuevo sello: '+nw[0]:'🏅 '+nw.length+' sellos nuevos')}}

const _mc=mClick;mClick=function(k,s){_mc(k,s);const p=V.ps;if(p&&p.fin&&!p.cnt){p.cnt=1;S.mt=(S.mt||0)+1;save();render()}};
function achV(){const L=AC.map(a=>{const[c,t]=a[3]();return{a,c,t,ok:c>=t}}),n=L.filter(x=>x.ok).length;const h=`<div class="box" style="margin-bottom:14px"><div class="ph"><b>Tu colección de sellos</b><span class="mut">${n} / ${AC.length}</span></div><div class="bar"><i style="width:${n/AC.length*100}%"></i></div></div><div class="stamps">${L.map(x=>{const nw=x.ok&&!S.vw[x.a[1]];return`<div class="sc"><div class="stamp ${x.ok?'':'lock'} ${nw?'new':''}">${x.a[0]}</div><b>${x.a[1]}</b><small>${x.ok?'Conseguido el '+new Date(S.un[x.a[1]]||Date.now()).toLocaleDateString('es-CL',{day:'numeric',month:'short'}):x.a[2]}</small>${x.ok?'':`<div class="sbar"><i style="width:${Math.min(100,x.c/x.t*100)}%"></i></div><small>${Math.min(x.c,x.t)}/${x.t}</small>`}</div>`}).join('')}</div>`;L.forEach(x=>{if(x.ok)S.vw[x.a[1]]=1});save();return h}
const SLOT=(()=>{const n=K.length,pts=[];for(let i=0;i<n;i++){const r=Math.sqrt((i+.5)/n),t=i*2.399963;pts.push([180+138*r*Math.cos(t),112+86*r*Math.sin(t)])}let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,idx=[...pts.keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx.map(i=>pts[i])})();
const BR=[['M180 292C176 250 186 215 178 178',15],['M178 205C150 190 122 178 96 150',8],['M181 192C212 180 245 166 272 140',8],['M178 182C165 162 150 142 140 110',6],['M182 176C200 152 214 130 228 100',6],['M179 180C181 152 177 126 182 94',6]];
function tree(){let a=0,v=0;const fl=K.map((x,i)=>{const s=stOf(x.k),[px,py]=SLOT[i];if(s===2){a++;return`<g class="fl" style="--d:${i%30}"><use href="#fl" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(i*47)%72}) scale(${(.85+((i*37)%6)/20).toFixed(2)})"/><title>${x.k} · aprendido</title></g>`}if(s===1){v++;return`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.4" fill="#ffb3cc" stroke="#ff8fb3" stroke-width=".8"><title>${x.k} · visto</title></circle>`}return`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="1.9" fill="#ffd6e5"><title>${x.k} · nuevo</title></circle>`}).join('');const fx=i=>180+((i*53)%200)-100,fall=Array.from({length:Math.min(a,26)},(_,i)=>`<ellipse cx="${fx(i)}" cy="${290+((i*7)%9)-2}" rx="3.2" ry="1.7" fill="#ff9ab9" opacity=".8" transform="rotate(${(i*29)%60-30} ${fx(i)} 292)"/>`).join('');return{a,v,svg:`<svg class="tree" viewBox="0 0 360 310" role="img" aria-label="Árbol de sakura con ${a} flores"><defs><g id="fl"><g fill="#ff7fa8">${[0,72,144,216,288].map(r=>`<circle cx="0" cy="-5" r="4.4" transform="rotate(${r})"/>`).join('')}</g><circle r="2.1" fill="#ffd166"/></g><radialGradient id="gl"><stop offset="0" stop-color="#ffd6e5" stop-opacity=".9"/><stop offset="1" stop-color="#ffd6e5" stop-opacity="0"/></radialGradient></defs><ellipse cx="180" cy="112" rx="165" ry="105" fill="url(#gl)"/><ellipse cx="180" cy="296" rx="120" ry="9" fill="#ffe4ee"/>${BR.map(b=>`<path d="${b[0]}" fill="none" stroke="#7a5446" stroke-width="${b[1]}" stroke-linecap="round"/>`).join('')}${fall}${fl}</svg>`}}
function homeV(){const g=recG(),gr=G[g],d=K[Math.floor(Date.now()/864e5)%K.length],v=d.v[0],t=tree(),n=K.length,dt=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}),fresh=!Object.keys(S.st).length&&!Object.keys(S.cards).length;return`<div class="tc"><div class="petals">${[...Array(7)].map((_,i)=>`<i style="left:${8+i*13}%;animation-delay:${i*1.3}s;animation-duration:${9+i%3*2}s"></i>`).join('')}</div><div class="tch"><div><div class="mut" style="font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Tu árbol de sakura</div><h2><span>${t.a}</span> flores <small>de ${n}</small></h2></div><div class="tcc"><span>🔥 ${S.streak}</span><span>Nv. ${lvl()}</span></div></div>${t.svg}<div class="lg" style="justify-content:center"><span><s class="a"></s>${t.a} flores</span><span><s class="v"></s>${t.v} capullos</span><span><s class="n"></s>${n-t.a-t.v} por descubrir</span></div><div class="tcf"><div><div class="mut" style="font-size:.78rem">Sigue con</div><b>${gr[0]} ${gr[1]}</b></div><button class="btn pri" onclick="go('fc',undefined,${g})">Continuar →</button></div></div><div class="dc sm" style="margin-top:14px"><div class="wm">${d.k}</div><div class="dtop"><span>✦ Kanji del día</span><span>${dt}</span></div><div class="drow"><div class="tile">${sv(d.k)}</div><div class="dinfo"><h2>${d.es}</h2><div class="den">${v.w} (${v.r}) · ${d.s} trazos</div><div class="dch"><span>音 ${d.on}</span><span>訓 ${d.kun}</span></div><div class="dact" style="margin-top:10px"><button class="btn pri" onclick="det('${d.k}')">Ver ficha</button><button class="btn" onclick="setSt('${d.k}',2)">${stOf(d.k)===2?'✓ Ya lo sabes':'Ya lo sé'}</button></div></div></div></div>${fresh?`<div class="box cont"><div><b>¿Ya conoces algunos kanjis?</b><div class="mut">Márcalos y tu árbol florece de una vez.</div></div><button class="btn" onclick="libSel(null)">Marcar</button></div>`:''}`}
function planV(){const g=recG(),gr=G[g],l=K.filter(x=>x.g===g),gm=l.filter(x=>mast(x.k)).length,n=AC.filter(a=>{const[c,t]=a[3]();return c>=t}).length;return`<div class="sec" style="margin-top:0">Plan de hoy</div><div class="plan"><div class="pl ${S.seen?'dn':''}" onclick="go('ov')"><i>${S.seen?'✓':'1'}</i><div><b>Mira el panorama</b><span class="mut">${S.seen?'¡Hecho! Vuelve cuando quieras':K.length+' kanjis, un vistazo por tema'}</span></div></div><div class="pl" onclick="libSel(null)"><i>2</i><div><b>Marca los que ya conoces</b><span class="mut">Salta lo que ya dominas</span></div></div><div class="pl" onclick="go('fc',undefined,${g})"><i>3</i><div><b>Estudia ${gr[0]} ${gr[1]}</b><span class="mut">${gm}/${l.length} aprendidos</span></div></div><div class="pl" onclick="V.g=${g};go('fc')"><i>4</i><div><b>Practica lo que ya viste</b><span class="mut">Escribe, completa, empareja, dibuja y quiz</span></div></div></div><div class="box cont" style="cursor:pointer" onclick="go('ach')"><div><b>🏅 Tus sellos</b><div class="mut">${n} de ${AC.length} conseguidos</div></div><span style="font-size:1.3rem">→</span></div>`}
function render(){checkAch();const t=V.tab,T={home:'🌸 Kanji Quest',plan:'📋 Mi plan',ov:'🔭 Panorama',grp:'🧩 Aprender',map:'🧩 Aprender',fc:'🃏 Repaso',qz:'⚔️ Quiz',lib:'📖 Biblioteca',ach:'🏅 Logros'};let h=`<div class="top"><h1>${T[t]}</h1></div>`;h+=t==='home'?homeV():t==='plan'?planV():t==='ach'?achV():t==='ov'?ovV():(t==='grp'||t==='map')?learnV():t==='fc'?fcV():t==='qz'?qzV():libV();document.getElementById('app').innerHTML=h;const on=(t==='ov'||t==='map')?'grp':t==='qz'?'fc':t;document.getElementById('bn').innerHTML=[['home','🏠','Inicio'],['plan','📋','Plan'],['grp','🧩','Aprender'],['fc','🃏','Repaso'],['lib','📖','Biblioteca'],['ach','🏅','Logros']].map(x=>`<button class="${on===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}
