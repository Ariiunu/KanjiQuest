<script>/* the chosen letter style; its font file is only fetched when it is in use */var f;try{f=localStorage.getItem('kfont')}catch(e){}var FU={klee:'Klee+One:wght@400;600',mplus:'M+PLUS+Rounded+1c:wght@400;700;800'};if(f&&f!=='zen'){document.documentElement.dataset.font=f;if(FU[f])document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family='+FU[f]+'&display=swap">')}</script>
