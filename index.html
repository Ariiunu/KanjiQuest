return`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><div class="seg" style="margin:0">${[['h','Hiragana'],['k','Katakana']].map(s=>`<button class="${V.ks===s[0]?'on':''}" onclick="V.ks='${s[0]}';V.ss=[];render()">${s[1]}</button>`).join('')}</div><button class="btn ${V.sel?'pri':''}" onclick="V.sel=!V.sel;V.ss=[];render()">${V.sel?'Listo':ic('check',16,'#c94f7a','none')+' Seleccionar'}</button></div>${V.sel?`<div class="selbar"><b>${V.ss.length}</b> seleccionados<button class="btn" onclick="V.ss=K.filter(x=>V.ks==='k'?x.g>=5:x.g<5).map(x=>x.k);render()">Toda la tabla</button><span class="mut">Marcar como:</span><button class="btn pri" onclick="bulk(2)">Aprendido</button><button class="btn" onclick="bulk(1)">Visto</button><button class="btn" onclick="bulk(0)">No visto</button></div>`:`<p class="mut" style="margin:0 0 8px">Toca un kana para ver su ficha, o «Seleccionar» para marcar varios.</p>`}<div class="box" style="margin-bottom:6px">${stk(list)}</div>
${sec('Básico',kTab(KROWS,['a','i','u','e','o'],r=>[...r].map(c=>c==='_'?null:cv(c))))}
${sec('Con tenten ゛ y maru ゜',kTab(DROWS,['a','i','u','e','o'],r=>[...r].map(cv)))}
${sec('Combinados '+(kat?'ャ ュ ョ':'ゃ ゅ ょ'),kTab([...YROWS],['ya','yu','yo'],r=>['ゃ','ゅ','ょ'].map(s=>cv(r+s))))}
${kat?sec('Extendido',`<div class="ktab" style="grid-template-columns:repeat(4,1fr)">${K.filter(x=>x.g===10).map(x=>kCell(x.k)).join('')}</div>`):''}`}
// levels as a path: kana first, then N5, then N4
const LVI={kana:['Nivel 0','Empieza aquí',1],n5:['Nivel 1','Principiante',2],n4:['Nivel 2','Básico',3]};
S.ls=S.ls||{};
const kat=x=>/[ァ-ヺ]/.test(x.k[0]),snd=x=>x.es==='wo'?'o':x.es;
// Japanese voice: prefer the device's best ja-JP voice so pitch accent and intonation sound native
const AU={off:false};
const hasJa=()=>{try{return !AU.off&&speechSynthesis.getVoices().some(v=>/^ja/i.test(v.lang))}catch(e){return false}};
function jaVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)),pref=['Kyoko','O-Ren','Otoya','Hattori','Nanami','Keita','Google','Haruka','Ayumi','Sayaka','Ichiro'],sc=v=>(/premium|enhanced|mejorad|natural|neural/i.test(v.name)?0:10)+((i=>i<0?9:i)(pref.findIndex(p=>v.name.includes(p))));return vs.sort((a,b)=>sc(a)-sc(b))[0]||null}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
// Chrome can wedge if speak() follows cancel() right away, and some browsers never start at all:
// wait a moment after cancelling, retry once with the default Japanese voice, then tell the user
function say(t,retry){const ss=window.speechSynthesis;if(!ss)return toast('Este navegador no tiene voz');const v=retry?null:jaVoice();if(!v&&!retry&&!hasJa())return toast('Instala una voz japonesa en los ajustes de voz del sistema');
const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';if(v)u.voice=v;u.rate=[...t].length<3?.7:.85;let ok=false;u.onstart=()=>{ok=true;AU.off=false};ss.resume();ss.speak(u);
setTimeout(()=>{if(ok)return;ss.cancel();if(!retry)return say(t,1);AU.off=true;toast('El audio no funciona en este navegador. Prueba en Chrome, Safari o en tu celular.')},1500)};
if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,150)}else go()}
const sayB=(t,s,big)=>`<button class="say ${big?'big':''}" onclick="event.stopPropagation();say('${t}')" aria-label="Escuchar">${ic('sound',s)}</button>`;

// rule cards: explain the patterns instead of memorising 213 kana one by one
const RU={
wo:['を y は','を suena «o» y casi solo se usa como partícula (ほんをよむ, leer un libro). Y cuando は es partícula se lee «wa».',[['を','o'],['お','o'],['は','ha / wa']]],
dak:['゛ Tenten','Dos rayitas arriba a la derecha hacen el sonido más sonoro: k→g, s→z, t→d, h→b. じ y ぢ suenan igual (ji), y ず y づ también (zu); casi siempre se usan じ y ず.',[['か→が','ka→ga'],['さ→ざ','sa→za'],['た→だ','ta→da'],['は→ば','ha→ba']]],
han:['゜ Maru','El circulito solo va en la fila h y la convierte en p.',[['は→ぱ','ha→pa'],['ひ→ぴ','hi→pi'],['ふ→ぷ','fu→pu'],['ほ→ぽ','ho→po']]],
yoon:['Combinados','Un kana de la columna i (き, し, ち…) más una ゃ ゅ ょ pequeña forman una sola sílaba. Fíjate en el tamaño: きや son dos sílabas (ki-ya), きゃ es una (kya).',[['き+ゃ','kya'],['し+ゅ','shu'],['ち+ょ','cho']]],
tsu:['っ pequeña','Una っ pequeña duplica la consonante que viene después: se hace una pausa cortita antes de ella.',[['きって','kitte'],['がっこう','gakkou'],['ちょっと','chotto']]],
long:['Vocales largas','En hiragana una vocal se alarga escribiendo otra vocal (おかあさん, くうき). En katakana se usa la raya ー (ケーキ, コーヒー).',[['おかあさん','okaasan'],['くうき','kuuki'],['ケーキ','keeki']]],
kata:['Katakana','Tiene los mismos sonidos que el hiragana, pero se usa sobre todo para palabras extranjeras (カメラ, テレビ) y nombres de otros países.',[['か→カ','ka'],['さ→サ','sa'],['の→ノ','no']]],
ext:['Katakana extendido','Para sonidos que no existen en japonés se combina un kana con una vocal pequeña.',[['ファ','fa'],['ティ','ti'],['ウィ','wi'],['ヴ','vu']]]};
const ruleH=r=>{const[t,d,ex]=RU[r];return`<div class="box rule"><span class="jt">Regla</span><h3 style="margin:6px 0">${t}</h3><p class="mut" style="margin:0">${d}</p><div class="rex">${ex.map(e=>`<span>${e[0]}<small>${e[1]}</small></span>`).join('')}</div></div>`};
function ruleQ(it){return ruleH(it.r)+`<div class="ovnav" style="justify-content:center"><button class="btn pri big" onclick="pNext()">Entendido →</button></div>`}
function introQ(it){return`<div class="slide">${kSlide(it.k)}</div><div class="ovnav" style="justify-content:center"><button class="btn pri big" onclick="introOk()">Siguiente →</button><span class="mut swh">o arrastra la ficha a la izquierda</span></div>`}
function introOk(){const k=V.ps.items[V.ps.i].k.k;if(!stOf(k)){S.st[k]=1;save()}pNext()}

// kana lessons: one row (about 5 kana) at a time, in the order people learn them
const LES=[];
if(KN){const add=(sec,cs,rule)=>{const ks=cs.map(c=>K.find(x=>x.k===c)).filter(Boolean);if(ks.length)LES.push({id:'L'+LES.length,sec,ks,t:ks.map(x=>x.k).join(' '),r:ks.map(x=>x.es).join(' '),rule:rule||[]})};
const ROWS=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','やゆよ','らりるれろ','わをん'],DR=['がぎぐげご','ざじずぜぞ','だぢづでど','ばびぶべぼ','ぱぴぷぺぽ'],YR=['きしち','にひみ','りぎじ','びぴ'];
[0,1].forEach(kk=>{const cv=s=>kk?tw(s):s,nm=kk?'Katakana':'Hiragana';
ROWS.forEach((r,i)=>add(nm,[...cv(r)],kk&&!i?['kata']:!kk&&i===9?['wo']:null));
DR.forEach((r,i)=>add(nm+' con tenten',[...cv(r)],!i?(kk?null:['dak']):i===4&&!kk?['han']:null));
YR.forEach((r,i)=>add(nm+' combinados',[...cv(r)].flatMap(c=>['ゃ','ゅ','ょ'].map(s=>c+cv(s))),kk?(i===0?['long']:null):i===0?['yoon']:i===1?['tsu']:null))});
const ex=K.filter(x=>x.g===10).map(x=>x.k);add('Katakana extendido',ex.slice(0,8),['ext']);add('Katakana extendido',ex.slice(8))}
const nextLesson=()=>LES.find(L=>!S.ls[L.id]);
function lessonItems(L){const known=K.filter(x=>kat(x)===kat(L.ks[0])&&(stOf(x.k)>=1||L.ks.includes(x)||S.ls[(LES.find(l=>l.ks.includes(x))||{}).id])),pool=known.length>=4?known:known.concat(K.filter(x=>x.g===L.ks[0].g&&!known.includes(x)));
// options only from kana you already know (plus this lesson's)
const mk=(k,t)=>{const o=sh(pool.filter(x=>x!==k&&snd(x)!==snd(k))),n=Math.min(4,o.length+1);if(t==='k2r')return{k,tag:'読み方 · ¿Cómo se lee?',q:`<div class="qk">${k.k}</div>`,...opts(k.es,o.map(x=>x.es),n)};if(t==='listen')return{k,kind:'listen',au:k.k,kf:1,tag:'聴解 · Escucha',q:`${sayB(k.k,30,1)}<p>¿Cuál escuchaste?</p>`,...opts(k.k,o.map(x=>x.k),n)};return{k,kf:1,tag:'表記 · ¿Cuál es?',q:`<div class="rom">${k.es}</div>`,...opts(k.k,o.map(x=>x.k),n)}};
return[...L.rule.map(r=>({kind:'rule',r})),...L.ks.map(k=>({kind:'intro',k})),...sh(L.ks.flatMap(k=>[mk(k,'k2r'),mk(k,hasJa()?'listen':'rk')])),...sh(L.ks.map(k=>mk(k,'rk')))]}
function runSession(m,items,lesson){V.tab='fc';V.rm=m;V.ps={m,items:items.filter(Boolean),i:0,sc:0,a:null,cb:0,best:0,miss:[],sel:[],lesson};render();window.scrollTo(0,0)}
function startLesson(id){const L=LES.find(x=>x.id===id);if(L)runSession('lesson',lessonItems(L),id)}
function knowLesson(id){const L=LES.find(x=>x.id===id);L.ks.forEach(k=>setSt(k.k,2,0,1));S.ls[id]=1;save();toast(icW('check')+' Marcados como aprendidos');render()}

// "Estudiar hoy": due reviews first, then something new, built automatically
function revQ(k){for(const t of sh(KN?['kmean','rk','listen','read','fill']:MT)){const q=QB[t](k);if(q)return q}return QB.kmean(k)}
function startToday(){const now=Date.now(),due=sh(K.filter(x=>S.cards[x.k]&&(S.cards[x.k].due||0)<=now)).slice(0,12);let it=due.map(revQ),lesson;
if(KN){const L=nextLesson();if(L){lesson=L.id;it=it.concat(lessonItems(L))}}
else{const nw=K.filter(x=>stOf(x.k)===0&&x.g===recG()).slice(0,5);if(nw.length)it=it.concat(nw.map(k=>({kind:'intro',k})),sh(nw.map(k=>QB.kmean(k))),sh(nw.map(k=>QB.read(k)||QB.kmean(k))))}
if(!it.length){const seen=K.filter(x=>stOf(x.k)>=1);it=(seen.length?pick(seen,8):[]).map(revQ)}
if(!it.length)return toast('No hay nada pendiente');runSession('today',it,lesson)}
function todayH(){const now=Date.now(),due=K.filter(x=>S.cards[x.k]&&(S.cards[x.k].due||0)<=now).length,L=KN?nextLesson():null,nw=KN?0:K.filter(x=>stOf(x.k)===0&&x.g===recG()).slice(0,5).length,done=S.tdd===iso(now)&&!due,parts=[due?due+(due===1?' repaso':' repasos'):'',L?'lección '+L.t:nw?nw+' kanjis nuevos':''].filter(Boolean);
return`<div class="box today"><div class="row"><div class="gic">${ic(done?'check':'cal',24)}</div><div><div class="ey">Estudiar hoy</div><b>${done?'¡Listo por hoy!':parts.length?parts.join(' + '):'Repaso para no olvidar'}</b><div class="mut">${done?'Si quieres, puedes seguir practicando.':'La app arma la sesión por ti.'}</div></div></div><button class="btn pri big" onclick="pStart('today')">${done?'Seguir':'Empezar'} →</button></div>`}

// kana "Aprender": lessons path, groups and rules (no stroke worlds, no overview step)
V.lt='les';
function learnKana(){const nx=nextLesson();let sec='';const seg=`<div class="seg">${[['les','Lecciones'],['grp','Grupos'],['rul','Reglas']].map(s=>`<button class="${V.lt===s[0]?'on':''}" onclick="V.lt='${s[0]}';render()">${s[1]}</button>`).join('')}</div>`;
if(V.lt==='grp')return seg+grpV();if(V.lt==='rul')return seg+`<div class="rgrid">${Object.keys(RU).map(ruleH).join('')}</div>`;
return seg+`<p class="mut" style="margin:-4px 0 14px">Cada lección presenta unos pocos kana con su trazo y su sonido, y termina con un mini quiz. Si ya conoces algunos, toca «Ya los sé».</p><div class="plan">${LES.map((L,i)=>{const h=L.sec!==sec?`<div class="sec">${L.sec}</div>`:'';sec=L.sec;const dn=S.ls[L.id],cur=nx&&nx.id===L.id,lock=!dn&&!cur;return h+`<div class="pl ${dn?'dn':''} ${lock?'lock':''}" ${lock?'':`onclick="startLesson('${L.id}')"`}><i>${dn?ic('check',16,'#fff','none'):lock?ic('lock',14,'#c9a3b2','none'):i+1}</i><div style="flex:1;min-width:0"><b class="kp" style="font-size:1.15rem">${L.t}</b><span class="mut">${L.r}</span></div>${cur?`<span class="btn pri">Empezar</span>`:''}${dn?'':`<button class="btn kn" onclick="event.stopPropagation();knowLesson('${L.id}')">Ya los sé</button>`}</div>`}).join('')}</div>`}
if(KN)learnV=learnKana;

// seals that make sense now: daily sessions; in kana, lessons instead of overview and quiz
AC[9]=['星','Estudiar hoy ×5','Completa 5 sesiones de «Estudiar hoy»',()=>[S.tdy||0,5]];
if(KN){AC[0]=['始','Primera lección','Completa tu primera lección',()=>[Object.keys(S.ls).length?1:0,1]];AC[10]=['課','5 lecciones','Completa 5 lecciones',()=>[Object.keys(S.ls).length,5]]}

// play the sound by itself when a new kana or a listening question appears
S.snd=S.snd??true;let ACX=null;
function ding(n=0){if(!S.snd)return;try{ACX=ACX||new(window.AudioContext||window.webkitAudioContext)();const c=ACX;c.resume();const t=c.currentTime,f0=880*Math.pow(2,Math.min(n,8)/12);[[f0,0],[f0*1.26,.09]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.16,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.35);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.4)})}catch(e){}}
function swipe(el,left,right){if(!el)return;let x0=null,dx=0,moved=false;
el.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('button,a,input,select'))return;x0=e.clientX;dx=0;moved=false;el.setPointerCapture(e.pointerId);el.style.animation='none';el.style.transition='none'});
el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8)moved=true;el.style.transform=`translateX(${dx}px) rotate(${dx/28}deg)`;el.dataset.dir=dx<-50&&left?'l':dx>50&&right?'r':''});
const up=()=>{if(x0===null)return;x0=null;el.style.transition='transform .22s ease, opacity .22s ease';const fly=(s,f)=>{el.style.transform=`translateX(${s*el.offsetWidth*1.2}px) rotate(${s*14}deg)`;el.style.opacity=0;setTimeout(f,180)};
if(dx<-90&&left)fly(-1,left);else if(dx>90&&right)fly(1,right);else{el.style.transform='';el.dataset.dir=''}};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
// a drag is not a click (so the card doesn't flip or replay strokes when you let go)
el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true)}
function swH(){const t=V.tab,p=V.ps;if(t==='ov'){const n=OVL().length;swipe(document.querySelector('.slide'),V.oi<n-1?()=>ovG(1):null,V.oi>0?()=>ovG(-1):null)}
else if(t==='fc'&&V.rm==='cards'&&V.fc&&V.fc.q.length){if(!V.fc.flip){const f=()=>{V.fc.flip=true;render()};swipe(document.querySelector('.scene'),f,f)}else{const el=document.querySelector('.slide');if(el){el.classList.add('fcs');swipe(el,()=>rate('hard'),()=>rate('good'))}}}
else if(t==='fc'&&p&&p.items&&V.rm===p.m){const it=p.items[p.i];if(it&&(it.kind==='intro'||it.kind==='rule')){const back=p.i>0&&['intro','rule'].includes(p.items[p.i-1].kind)?()=>{p.i--;render()}:null;swipe(document.querySelector(it.kind==='intro'?'.slide':'.rule'),it.kind==='intro'?introOk:pNext,back)}}}
const _ra=render;render=function(){_ra();swH();const p=V.ps;if(V.tab==='fc'&&p&&p.items&&V.rm===p.m&&p.a===null){const it=p.items[p.i];if(it&&!it.pl){if(it.kind==='intro'&&KN){it.pl=1;say(it.k.k)}else if(it.au){it.pl=1;say(it.au)}}}};

// kana look-alikes, so "difícil" offers the ones people mix up
const CF={};['ぬめ','われね','るろ','はほ','さきち','あおめ','いり','こに','たな','シツ','ソン','ノメ','クタ','ウワフ','チテ','コユ','ヌス','ナメ','ロコ','カヤ','セヤ','ケク','マム','ラフ','へヘ','りリ','かカ','きキ','もモ','やヤ','ぺペ','べベ'].forEach(s=>[...s].forEach(c=>CF[c]=(CF[c]||'')+s));
// long vowel mark ー counts as the vowel it stretches, so カヌー and kanuu match
const VW={};['あかさたなはまやらわがざだばぱゃぁ','いきしちにひみりぎじぢびぴぃ','うくすつぬふむゆるぐずづぶぷゅぅ','えけせてねへめれげぜでべぺぇ','おこそとのほもよろをごぞどぼぽょぉ'].forEach((s,i)=>[...s].forEach(c=>VW[c]='あいうえお'[i]));
const nrm=s=>r2k(s).replace(/(.)ー/g,(m,c)=>c+(VW[c]||''));
// two-character kana (きゃ) draw one character after the other
function svG(k,o){const p=SV[k];return`<svg class="sv" viewBox="0 0 109 109" onclick="this.outerHTML=this.outerHTML" role="img" aria-label="Orden de trazos de ${k}"><g class="ghost">${p.map(d=>`<path d="${d}"/>`).join('')}</g><g class="live">${p.map((d,i)=>`<path d="${d}" pathLength="1" style="--i:${i+o}"/>`).join('')}</g></svg>`}
function sv(k){const cs=[...k];if(!SV[k]&&cs.length>1&&cs.every(c=>SV[c])){let o=0;return`<span class="svm">${cs.map(c=>{const s=svG(c,o);o+=SV[c].length;return s}).join('')}</span>`}return SV[k]?svG(k,0):`<div class="big">${k}</div>`}
if(KN){K.forEach(x=>{const n=[...x.k].reduce((a,c)=>a+(SV[c]?SV[c].length:0),0);if(n)x.s=n});
libV=libKana;
const _go=go;go=function(t,b,g){if(t==='qz'){_go('fc',b,g);return pStart('mix')}_go(t,b,g)};
const kt=el=>{if(!el)return;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(/kanji/i.test(n.nodeValue)&&!/Tankyuu/.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/Kanji del día/g,'Kana del día').replace(/kanjis/g,'kanas').replace(/kanji/g,'kana')};
const _rk=render;render=function(){_rk();kt(document.getElementById('app'));kt(document.getElementById('side'))}}
V.tab=(()=>{try{const g=sessionStorage.getItem('kgo');sessionStorage.removeItem('kgo');return g?'home':'lvl'}catch(e){return'lvl'}})();
render();

</script>
</body>
</html>
